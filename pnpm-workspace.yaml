packages:
  - .
  - packages/*

allowBuilds:
  '@astryxdesign/core': false
  '@astryxdesign/cli': false
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core'
  - vite-plus
  - '@nkzw/fate@2.2.3'
  - react-fate@2.2.3
  - void-fate@2.2.3
  - '@nkzw/typeahead@0.1.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.7.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.7.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.7.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.7.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.7.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.7.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.7.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.7.0'
  - '@void/deploy-cloudflare@1.10.0'
  - '@void/deploy-core@1.10.0'
  - '@void/edge@1.10.0'
  - '@void/isr@1.10.0'
  - '@void/platform@1.10.0'
  - '@void/react@1.10.0'
  - cf@1.0.0-rc.0
  - void@1.10.0
  - '@cloudflare/workerd-darwin-64@1.20261117.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261117.1'
  - '@cloudflare/workerd-linux-64@1.20261117.1'
  - '@cloudflare/workerd-linux-arm64@1.20261117.1'
  - '@cloudflare/workerd-windows-64@1.20261117.1'
  - miniflare@5.20261117.0-beta
  - workerd@1.20261117.1
  - wrangler@4.164.0

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - msgpackr-extract
  - sharp
  - workerd

overrides:
  '@cloudflare/workers-types': 5.20261103.1
  better-auth: 1.7.25
  drizzle-orm: 0.45.4
  kysely: 0.28.17
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
